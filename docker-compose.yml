services:
  postgres:
    image: postgres:18
    container_name: dtem-board-postgres
    environment:
      POSTGRES_USER: dtem
      POSTGRES_PASSWORD: dtem
      POSTGRES_DB: dtem_board
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dtem -d dtem_board"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dtem-board-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: dtem-board-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dtem
      MINIO_ROOT_PASSWORD: change-me-minio-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
